services:
  postgres:
    image: postgres:16
    container_name: sistematicket-postgres
    environment:
      POSTGRES_DB: sistematicket
      POSTGRES_USER: sistematicket
      POSTGRES_PASSWORD: ${SISTEMATICKET_DB_PASSWORD:-cambiame}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistematicket -d sistematicket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

# PostgreSQL. Los valores por defecto coinciden con docker-compose.yml (desarrollo local);
# en otros entornos se pisan con variables de entorno.
spring.datasource.url=${SISTEMATICKET_DB_URL:jdbc:postgresql://localhost:5432/sistematicket}
spring.datasource.username=${SISTEMATICKET_DB_USER:sistematicket}
spring.datasource.password=${SISTEMATICKET_DB_PASSWORD:cambiame}

# Flyway versiona el esquema (db/migration); Hibernate solo lo valida contra las entidades.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Límites de adjuntos (CU02). El multipart toma el mismo tamaño para que haya una sola fuente de verdad.
app.adjuntos.tamanio-maximo-mb=5
app.adjuntos.maximo-por-ticket=5
spring.servlet.multipart.max-file-size=${app.adjuntos.tamanio-maximo-mb}MB
spring.servlet.multipart.max-request-size=-1

# Los intentos fallidos de login y los minutos de bloqueo (CU23 E1), el umbral de alerta de tiempos (CU11),
# las categorías y las prioridades se administran desde la aplicación (CU25), no desde este archivo.

# Administrador que se crea solo si no existe ninguna cuenta (primer arranque sin perfil demo).
# Si no se define SISTEMATICKET_ADMIN_PASSWORD se genera una contraseña temporal y se muestra en el log.
# En ambos casos el primer ingreso exige cambiarla.
app.admin-inicial.usuario=admin
app.admin-inicial.password=${SISTEMATICKET_ADMIN_PASSWORD:}

# Notificaciones (CU16): reintentos diferidos de las que fallan al enviarse.
app.notificaciones.maximo-intentos=3
app.notificaciones.reintento-ms=60000

# Sesión: minutos de inactividad tras los cuales el token expira
app.sesion.minutos-inactividad=30

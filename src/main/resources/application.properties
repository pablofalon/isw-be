# Base en archivo para que las cuentas y tickets cargados sobrevivan a un reinicio.
# Para una corrida descartable (ej. regresión) se puede pisar con jdbc:h2:mem:<nombre>.
spring.datasource.url=jdbc:h2:file:./data/sistematicket
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=admin

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Límites de adjuntos (CU02). El multipart toma el mismo tamaño para que haya una sola fuente de verdad.
app.adjuntos.tamanio-maximo-mb=5
app.adjuntos.maximo-por-ticket=5
spring.servlet.multipart.max-file-size=${app.adjuntos.tamanio-maximo-mb}MB
spring.servlet.multipart.max-request-size=-1

# Bloqueo temporal por intentos fallidos de login (CU23 E1).
app.login.maximo-intentos=5
app.login.minutos-bloqueo=15

# Administrador que se crea solo si no existe ninguna cuenta (primer arranque sin perfil demo).
# Si no se define SISTEMATICKET_ADMIN_PASSWORD se genera una contraseña temporal y se muestra en el log.
# En ambos casos el primer ingreso exige cambiarla.
app.admin-inicial.usuario=admin
app.admin-inicial.password=${SISTEMATICKET_ADMIN_PASSWORD:}

# Notificaciones (CU16): reintentos diferidos de las que fallan al enviarse.
app.notificaciones.maximo-intentos=3
app.notificaciones.reintento-ms=60000
